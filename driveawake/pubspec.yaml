name: driveawake
description: "DriverAwake - sistema inteligente de alerta para conductores somnolientos."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  camera: ^0.12.0+1
  cupertino_icons: ^1.0.8
  google_mlkit_commons: ^0.11.1
  google_mlkit_face_detection: ^0.13.2
  permission_handler: ^12.0.1
  vibration: ^3.1.8
  tflite_flutter: ^0.12.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  pdf: ^3.12.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  camera_android: ^0.10.10+17
  crypto: ^3.0.6
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.39
  path: ^1.9.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.28.2

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/models/drowsiness_mlp.tflite
    - assets/models/preprocessing_metadata.json
    - assets/models/model_manifest.json
    - assets/audio/magicdrive_alarm.wav
